        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeGroupMember
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /workspaces:
    get:
      operationId: listWorkspaces
      description: |
        The workspaces the caller can enter. For a system admin, that is all of
        them, and the deleted ones too, which nobody can enter until restored.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workspace" }
    post:
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /workspaces/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteWorkspace
      summary: Delete a workspace, which can be restored until it is purged (system admins only)
      description: |
        Hides the workspace from everyone; its exports are cancelled. The
        caller's session, if it is in the workspace, moves to another the
        caller can enter. Other sessions in it are left without a current
        workspace, so that their requests fail with no_workspace rather than
        act on another workspace. It is purged with everything in it after
        purgeAt. See .agents/design/access-control.md §2.3.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /workspaces/{id}/restore:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: restoreWorkspace
      summary: Put a deleted workspace back in use, as it was (system admins only)
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /workspaces/{id}/purge:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: purgeWorkspace
      summary: Delete a deleted workspace and everything in it now, for good (system admins only)
      responses:
        "204": { description: Purged }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /workspace:
