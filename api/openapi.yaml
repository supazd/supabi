    post:
      operationId: testEmailSettings
      summary: Send a test email with the settings given, saved or not (system admins only)
      description: |
        A password left out is the one saved. A failure at the server is a
        successful response that names the stage it failed at, in the
        server's words: only system administrators see it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailTestRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailTest" }
        "400": { $ref: "#/components/responses/Error" }

  /audit-events:
    get:
      operationId: listAuditEvents
      summary: Audit events of the organisation, newest first (system admins only)
      parameters:
        - { name: workspaceId, in: query, schema: { type: string } }
        - { name: userId, in: query, description: The user who acted, schema: { type: string } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/AuditCategory" } }
        - { name: outcome, in: query, schema: { $ref: "#/components/schemas/AuditOutcome" } }
        - { name: from, in: query, description: Inclusive start, schema: { type: string, format: date-time } }
        - { name: to, in: query, description: Exclusive end, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, description: nextCursor of the previous page, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "400": { $ref: "#/components/responses/Error" }

  /charts:
