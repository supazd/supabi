openapi: 3.0.3
info:
  title: SupaBI API
  version: 0.1.0
  description: |
    The contract between the SupaBI server and its clients. Server stubs and
    the frontend's types are generated from this file; change it first.

    Errors are returned as an Error object. `code` is stable and is what
    clients translate; `message` is English text for developers.

    Callers authenticate with the session cookie set by /auth/login. Apart
    from the /auth endpoints, a call without a session is answered with 401
    `unauthenticated`, and one the caller's role does not allow with 403
    `forbidden`.
servers:
  - url: /api/v1
paths:
  /version:
    get:
      operationId: getVersion
      summary: Version of the running server
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }

  /datasource-types:
    get:
      operationId: listDatasourceTypes
      summary: Kinds of database that can be connected, with their connection settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DatasourceType" }

  /datasources:
    get:
      operationId: listDatasources
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Datasource" }
    post:
      operationId: createDatasource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasourceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Datasource" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /datasources/test:
    post:
      operationId: testDatasource
      summary: Try to connect with the given settings without saving them
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasourceInput" }
      responses:
        "200":
          description: The attempt was made; see `ok`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionTest" }
        "400": { $ref: "#/components/responses/Error" }

  /datasources/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getDatasource
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Datasource" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateDatasource
      summary: Change how a data source connects. Its type stays; a password left out is kept.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasourceInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Datasource" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteDatasource
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /datasources/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: testStoredDatasource
      summary: >
        Try to connect as a saved data source does, or with the given settings
        before saving them over it. A password left out is the saved one.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasourceInput" }
      responses:
        "200":
          description: The attempt was made; see `ok`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionTest" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /datasources/{id}/describe:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: describeSource
      summary: Columns a dataset source would produce, without fetching rows
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DescribeRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SourceColumn" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /datasources/{id}/explain:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: explainSource
      summary: How the database would run a dataset source, without running it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DescribeRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /datasources/{id}/tables:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: listSourceTables
      summary: Tables and columns the data source holds, for helping an author write SQL
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceCatalog" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /datasources/{id}/functions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: listFunctions
      summary: The functions a calculated field can be written with on this data source
      description: >
        The platform's own functions, which mean the same on every database.
        One this kind of database has no way to compute is left out. See
        .agents/design/expressions.md.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExpressionFunction" }
        "404": { $ref: "#/components/responses/Error" }

  /datasources/{id}/check-expression:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: checkExpression
      summary: What an expression in the platform's language gives, or what is wrong with it
      description: >
        Reads an expression as it is written, with fields referred to by
        name, without asking the database anything.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpressionCheckInput" }
      responses:
        "200":
          description: The expression was read; see `error`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpressionCheck" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /datasets:
    get:
      operationId: listDatasets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DatasetSummary" }
    post:
      operationId: createDataset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasetInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /datasets/preview:
    post:
      operationId: previewDataset
      summary: The first rows of a dataset definition that need not be saved yet
      description: >
        Returns every row-level field of the definition, without grouping, so
        an author can see what the fields hold while editing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasetPreviewInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryResult" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /datasets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getDataset
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateDataset
      summary: Save a new revision of the dataset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasetUpdateInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteDataset
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /datasets/{id}/revisions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: listDatasetRevisions
      summary: Saved revisions, newest first, for data developers
      parameters:
        - $ref: "#/components/parameters/RevisionBefore"
        - $ref: "#/components/parameters/RevisionLimit"
      responses:
        "200":
          description: A page of revision summaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevisionPage" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /datasets/{id}/revisions/{revision}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: revision, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getDatasetRevision
      summary: Read an immutable dataset snapshot; restoring it requires the normal dataset save checks
      responses:
        "200":
          description: The saved definition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetRevision" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /user-attributes:
    get:
      operationId: listUserAttributes
      summary: Attributes and assignments in the current workspace
      responses:
        "200":
          description: User attributes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserAttribute" }
  /user-attributes/{key}:
    parameters:
      - in: path
        name: key
        required: true
        schema: { type: string }
    put:
      operationId: setUserAttribute
      summary: Create or replace a workspace attribute and its assignments (admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserAttributeInput" }
      responses:
        "200":
          description: Saved attribute
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAttribute" }
    delete:
      operationId: deleteUserAttribute
      summary: Delete an attribute; rules referencing it fail closed
      responses:
        "204": { description: Deleted }

  /datasets/{id}/impact:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: analyzeDatasetImpact
      summary: Preview destructive changes and the charts and dashboards they affect
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasetUpdateInput" }
      responses:
        "200":
          description: Impact of the proposed definition on the current revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetImpact" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /datasets/{id}/policy:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getDatasetPolicy
      summary: The dataset's data permissions, which restrict what viewers see of it
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetPolicy" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: setDatasetPolicy
      summary: Replace the dataset's data permissions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasetPolicy" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetPolicy" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /datasets/{id}/policy/preview:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: previewDatasetPolicy
      summary: The rows and fields of the dataset one user would see
      description: Uses the saved permissions, or those given, which are not saved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyPreviewRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyPreview" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /query:
    post:
      operationId: runQuery
      summary: Run a query described in the query IR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueryRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /time-ranges/resolve:
    post:
      operationId: resolveTimeRange
      summary: The dates a time range stands for now
      description: >
        Resolves a time range of a filter as a query would, in the
        workspace's time zone and with its first day of the week, so that a
        filter can show the dates it keeps.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimeRangeInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeRangeDates" }
        "400": { $ref: "#/components/responses/Error" }

  /exports:
    get:
      operationId: listExports
      summary: The current user's exports in every workspace they can enter, from data exploration and dashboards
      parameters:
        - { name: before, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Export history and server limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportPage" }
    post:
      operationId: createExport
      summary: Queue an immutable SQL snapshot for a CSV or XLSX export
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportInput" }
      responses:
        "202":
          description: Queued for a worker; independent of the browser session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Export" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /exports/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getExport
      summary: Status of an export owned by the caller, in any workspace they can enter
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Export" }
        "404": { $ref: "#/components/responses/Error" }

  /exports/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: cancelExport
      summary: Cancel a queued or running export
      responses:
        "204": { description: Cancellation requested }
        "404": { $ref: "#/components/responses/Error" }

  /exports/{id}/file:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: downloadExport
      summary: Download a completed, unexpired export after checking current permissions
      responses:
        "200":
          description: Private CSV or XLSX attachment
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }

  /exports/seen:
    post:
      operationId: markExportsSeen
      summary: Mark every new export result of the caller, in every workspace they can enter, as seen
      responses:
        "204": { description: Seen }

  /auth/session:
    get:
      operationId: getSession
      summary: Who the caller is. Always answers, signed in or not.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }

  /auth/setup:
    post:
      operationId: setup
      summary: Create the first administrator. Only works while there are no accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupInput" }
      responses:
        "200":
          description: The administrator was created and is now signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Signed out }

  /auth/password:
    post:
      operationId: changePassword
      summary: Change the caller's own password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: Changed. Other sessions of the user are ended. }
        "400": { $ref: "#/components/responses/Error" }

  /auth/workspace:
    post:
      operationId: switchWorkspace
      summary: Move the session to another workspace the caller can enter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceSwitch" }
      responses:
        "200":
          description: Switched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "404": { $ref: "#/components/responses/Error" }

  /users:
    get:
      operationId: listUsers
      summary: Global accounts, readable by system admins or current workspace developers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      operationId: createUser
      summary: Create a global account without granting workspace membership (system admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserChange" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /groups:
    get:
      operationId: listGroups
      summary: Global groups, readable by system admins or current workspace developers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
    post:
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /groups/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteGroup
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /members:
    get:
      operationId: listMembers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
    post:
      operationId: addMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /members/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberChange" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeMember
      responses:
        "204": { description: Deleted }
