    post:
      operationId: createDashboardView
      summary: Keep the conditions a dashboard is shared with, for a share link to name by a short id
      description: |
        Anyone who can open the dashboard can share it; the link grants no
        access. The same conditions shared again keep their id and the later
        expiry. See .agents/design/chart-dashboard.md 3.10.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardViewInput" }
      responses:
        "201":
          description: Kept
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardView" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

